name: Publicar posts agendados

on:
  schedule:
    - cron: "*/15 * * * *"   # confere a fila a cada 15 minutos
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["posts/**"]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar o que estiver no horário
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python publicador/publicar.py

      - name: Salvar status dos posts
        run: |
          git config user.name "robo-publicador"
          git config user.email "robo-publicador@users.noreply.github.com"
          git add posts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza status dos posts"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
