name: Testar conexão com os perfis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["status/testar-agora"]

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar token em cada perfil
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python publicador/testar.py

      - name: Salvar resultado
        run: |
          git config user.name "robo-publicador"
          git config user.email "robo-publicador@users.noreply.github.com"
          git add status/teste.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Resultado do teste de conexão"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
