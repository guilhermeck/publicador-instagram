name: Consulta (somente leitura)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["status/consulta.json"]

permissions:
  contents: write

jobs:
  consulta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar consulta
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          python publicador/consulta.py
          for f in status/consulta-*.json; do
            openssl cms -encrypt -binary -aes256 -in "$f" -out "$f.enc" -outform DER status/chave-publica.pem
            rm "$f"
          done

      - name: Salvar resultado
        run: |
          git config user.name "robo-publicador"
          git config user.email "robo-publicador@users.noreply.github.com"
          git add status
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Resultado de consulta"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
